[project]
name = "oathon-sdk"
version = "0.1.0a1"
description = "Oathon v0.1 protocol SDK (Phase 1: validation and verification)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "rfc8785>=0.1.4",
    "jsonschema>=4.26.0",
    "rfc3161-client>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=9", "hypothesis>=6"]

[project.scripts]
oathon = "oathon.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oathon = ["specdata/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
