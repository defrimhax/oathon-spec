[project]
name = "oathon-sdk"
version = "0.1.0"
description = "Reference SDK and CLI for the Oathon protocol: provable mandates and tamper-evident evidence for autonomous AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Oathon" }]
keywords = ["ai-agents", "audit", "evidence", "cryptography", "rfc3161", "ed25519", "mandates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "rfc8785>=0.1.4",
    "jsonschema>=4.26.0",
    "rfc3161-client>=1.0",
]

[project.urls]
Homepage = "https://github.com/def933/oathon-spec"
Specification = "https://github.com/def933/oathon-spec/blob/main/CRYPTOGRAPHY.md"

[project.optional-dependencies]
test = ["pytest>=9", "hypothesis>=6"]

[project.scripts]
oathon = "oathon.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oathon = ["specdata/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
